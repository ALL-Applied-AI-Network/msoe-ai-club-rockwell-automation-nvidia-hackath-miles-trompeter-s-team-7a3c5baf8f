<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vial inspection architecture</title>
  <desc id="desc">Recorded vial and tank cameras and a recipe schedule feed vial capture and timestamp alignment. Color measurements drive appearance findings; Cosmos provides separate visual explanations. The dashboard shows findings, batch comparisons, and CSV export. Third-vial comparisons are retrospective.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 1 L8 5 L0 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243041; }
      .heading { font-size: 29px; font-weight: 700; }
      .body { font-size: 23px; fill: #536174; }
      .label { font-size: 20px; fill: #536174; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="80" y="100" font-size="48" font-weight="700">Vial inspection architecture</text>
  <text x="80" y="145" font-size="25" fill="#64748b">Measured appearance findings + contextual visual explanations</text>

  <rect class="box" x="80" y="325" width="290" height="230"/>
  <text class="heading" x="108" y="375">Inputs</text>
  <text class="body" x="108" y="425">Vial + tank recordings</text>
  <text class="body" x="108" y="466">Intended recipe</text>
  <text class="body" x="108" y="507">Recipe order + times</text>

  <rect class="box" x="435" y="325" width="295" height="230"/>
  <text class="heading" x="463" y="375">Capture &amp; align</text>
  <text class="body" x="463" y="425">Detect and crop vial</text>
  <text class="body" x="463" y="466">Select tank frame</text>
  <text class="body" x="463" y="507">Match recipe by time</text>
  <path class="line" d="M370 440 H425"/>

  <rect x="820" y="235" width="335" height="210" rx="16" fill="#eef3f9" stroke="#9badc5" stroke-width="2"/>
  <text class="heading" x="848" y="284">Color measurements</text>
  <text class="body" x="848" y="330">Sample liquid region</text>
  <text class="body" x="848" y="369">Compare across vials</text>
  <text class="body" x="848" y="408">Flag appearance changes</text>

  <rect class="box" x="820" y="505" width="335" height="190"/>
  <text class="heading" x="848" y="554">Cosmos Reason</text>
  <text class="body" x="848" y="600">Describe visible differences</text>
  <text class="body" x="848" y="639">Explain possible causes</text>
  <text class="label" x="848" y="674">Advisory; does not override flags</text>

  <path class="line" d="M730 410 H775 V340 H810"/>
  <path class="line" d="M730 475 H775 V595 H810"/>
  <text class="label" x="820" y="212">Measurements drive findings</text>

  <rect class="box" x="1240" y="325" width="285" height="230"/>
  <text class="heading" x="1268" y="375">Operator dashboard</text>
  <text class="body" x="1268" y="425">Appearance indicators</text>
  <text class="body" x="1268" y="466">Batch comparisons</text>
  <text class="body" x="1268" y="507">Review + CSV export</text>
  <path class="line" d="M1155 340 H1195 V395 H1230"/>
  <path class="line" d="M1155 595 H1195 V485 H1230"/>

  <rect x="80" y="760" width="1445" height="75" rx="10" fill="#f5f6f8"/>
  <text x="108" y="792" font-size="22" font-weight="700">Two time scopes</text>
  <text x="108" y="820" font-size="21" fill="#536174">Current findings use available observations. Third-vial reference comparisons are retrospective, after the batch finishes.</text>
</svg>
