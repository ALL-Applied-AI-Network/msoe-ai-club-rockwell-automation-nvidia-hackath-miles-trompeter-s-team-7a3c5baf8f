 .label{font-size:16px}.small{font-size:13px;fill:#52616a}.name{font-size:22px;font-weight:700}
 .box{fill:white;stroke:#8a969e;stroke-width:1.5}.wire{fill:none;stroke:#30383d;stroke-width:1.8;marker-end:url(#a)}
 .boundary{fill:none;stroke:#9ca8af;stroke-width:1.3}.group{font-size:14px;letter-spacing:1.6px;fill:#52616a;font-weight:700}
 </style>
