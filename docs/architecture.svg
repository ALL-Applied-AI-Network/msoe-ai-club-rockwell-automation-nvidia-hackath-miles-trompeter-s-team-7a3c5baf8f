<text class="name" x="959" y="398" text-anchor="middle">Cosmos Reason</text>
<text class="small" x="959" y="425" text-anchor="middle">NVIDIA · Reason2 8B</text>
<text class="small" x="959" y="450" text-anchor="middle">vLLM · Brev GPU</text>
<line x1="840" y1="473" x2="1077" y2="473" stroke="#ccd4d9"/>
<text class="label" x="959" y="511" text-anchor="middle">Visual descriptions</text>
<text class="label" x="959" y="543" text-anchor="middle">Possible-cause explanations</text>
