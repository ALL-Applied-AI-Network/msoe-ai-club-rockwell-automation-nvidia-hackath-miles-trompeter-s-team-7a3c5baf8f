 <g id="react" fill="none" stroke="#36b9df" stroke-width="3"><ellipse rx="44" ry="16"/><ellipse rx="44" ry="16" transform="rotate(60)"/><ellipse rx="44" ry="16" transform="rotate(120)"/><circle r="7" fill="#36b9df" stroke="none"/></g>
