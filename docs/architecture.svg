<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Vial inspection inference pipeline</title>
<desc id="desc">A reference-inspired technical diagram with an application stack, local inspection pipeline, remote Cosmos reasoning, and evidence storage and review. Only implemented services are shown.</desc>
<defs>
