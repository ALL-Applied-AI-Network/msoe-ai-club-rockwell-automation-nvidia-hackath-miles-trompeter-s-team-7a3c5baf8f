 <g id="db" fill="white" stroke="#25657d" stroke-width="2"><path d="M0 12 V55 C0 73 66 73 66 55 V12"/><ellipse cx="33" cy="12" rx="33" ry="12"/><path d="M0 32 C0 50 66 50 66 32 M0 47 C0 65 66 65 66 47" fill="none"/></g>
 <g id="monitor" stroke="#25657d" stroke-width="3" fill="white"><rect width="82" height="52" rx="3"/><path d="M41 52 V67 M23 67 H59"/><path d="M13 39 V25 M29 39 V14 M45 39 V22 M61 39 V10" stroke="#168d9c" stroke-width="7"/></g>
